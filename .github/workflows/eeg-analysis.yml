name: EEG Analysis

on:
  push:
    paths:
      - 'projects/eeg-analysis/**'
      - '.github/workflows/eeg-analysis.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r projects/eeg-analysis/requirements.txt
      - name: Compile EEG analysis package
        run: python -m compileall -q projects/eeg-analysis/src projects/eeg-analysis/scripts
      - name: Check command-line interface
        run: python projects/eeg-analysis/scripts/run_analysis.py --help
      - name: Verify committed aggregate evidence
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("projects/eeg-analysis/results/full_cohort")
          run = json.loads((root / "run_info.json").read_text())
          audit = json.loads((root / "provenance/dataset_audit.json").read_text())
          rows = list(csv.DictReader((root / "summary.csv").open()))
          assert run["dataset_summary"]["n_subjects"] == 104
          assert run["dataset_summary"]["n_trials"] == 4680
          assert audit["n_edf_files_verified"] == 312
          assert audit["checksum_mismatches"] == 0
          assert [row["method"] for row in rows] == ["majority", "bandpower_logreg", "csp_lda"]
          print("Aggregate evidence is present and internally consistent.")
          PY
