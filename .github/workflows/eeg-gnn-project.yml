name: EEG-GNN software validation

on:
  pull_request:
    paths:
      - "projects/eeg-gnn-fyp/**"
      - ".github/workflows/eeg-gnn-project.yml"
  push:
    branches: [main]
    paths:
      - "projects/eeg-gnn-fyp/**"
      - ".github/workflows/eeg-gnn-project.yml"

permissions:
  contents: read

jobs:
  software-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/eeg-gnn-fyp/pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e 'projects/eeg-gnn-fyp[test]'
      - name: Run software tests
        working-directory: projects/eeg-gnn-fyp
        run: python tests/run_tests.py
      - name: Run synthetic model smoke check
        working-directory: projects/eeg-gnn-fyp
        run: python scripts/run_deep.py --synthetic --smoke --out "$RUNNER_TEMP/eeg-gnn-smoke"
