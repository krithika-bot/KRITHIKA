[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-analysis-ai-ml"
version = "1.0.0"
description = "Reproducible, participant-aware classical ML analysis of public motor-imagery EEG"
requires-python = ">=3.10"
dependencies = [
  "mne>=1.7,<2.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.0", "ipykernel>=6.0"]

[project.scripts]
eeg-analysis = "eeg_analysis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
